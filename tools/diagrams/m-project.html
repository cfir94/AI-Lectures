<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><style>
  :root{ --purple:#7a59bc; --blue:#4378ab; --ink:#161922; --muted:#5b6475;
         --line:#d7dce6; --card:#ffffff; }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:transparent}
  .sheet{width:1640px;padding:40px 48px}
  .box{border:2px solid var(--line);border-radius:26px;background:var(--card);padding:24px 26px}
  h3{margin:0;font-size:36px;font-weight:600;color:var(--ink)}
  h3 small{display:block;font-size:24px;font-weight:400;color:var(--muted);margin-top:6px}
  .ltr{direction:ltr;unicode-bidi:isolate}
  .cols{display:flex;gap:26px;align-items:stretch}
  .mem{flex:0.85;border:2px solid var(--line);border-radius:22px;background:#fff;padding:22px 24px}
  .prj{flex:1.35;border:2px solid var(--purple);border-radius:22px;background:#fff;padding:22px 24px}
  h3{margin:0 0 6px;font-size:30px}
  .sub{font-size:24px;color:var(--muted);margin:0 0 16px}
  .mem p.b{margin:0;font-size:25px;color:var(--ink);line-height:1.5}
  .part{border:1.5px solid var(--line);border-radius:14px;padding:13px 17px;margin-bottom:11px;background:#fcfdff}
  .part b{display:block;font-size:25px;color:var(--purple);margin-bottom:3px}
  .part span{font-size:23px;color:var(--muted)}
  .egs{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .egs span{font-size:23px;border:1.5px solid var(--line);border-radius:999px;padding:7px 16px;color:var(--ink)}
</style><body><div class="sheet" id="shot">
  <div class="cols">
    <div class="mem">
      <h3>זיכרון</h3>
      <p class="sub">חוצה שיחות</p>
      <p class="b">הוא זוכר עובדות והעדפות משיחה לשיחה — ואפשר לראות בדיוק מה הוא זוכר, ולערוך.</p>
    </div>
    <div class="prj">
      <h3>פרויקט</h3>
      <p class="sub">סביבת עבודה קבועה לתחום אחד</p>
      <div class="part"><b>הוראות קבועות</b><span>מי אני, מה התפקיד, ואיך אני רוצה תשובות</span></div>
      <div class="part"><b>קבצי בסיס</b><span>נהלים, תבניות, נתונים</span></div>
      <div class="part"><b>שיתוף עם הצוות</b><span>כולם עובדים מאותו בסיס</span></div>
      <div class="egs"><span>תקציב 2027</span><span>ועדת כספים</span><span>ענף התיירות</span></div>
    </div>
  </div>
</div></body></html>
