<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><style>
  :root{ --purple:#7a59bc; --blue:#4378ab; --ink:#161922; --muted:#5b6475;
         --line:#d7dce6; --card:#ffffff; }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:transparent}
  .sheet{width:1640px;padding:40px 48px}
  .box{border:2px solid var(--line);border-radius:26px;background:var(--card);padding:24px 26px}
  h3{margin:0;font-size:36px;font-weight:600;color:var(--ink)}
  h3 small{display:block;font-size:24px;font-weight:400;color:var(--muted);margin-top:6px}
  .ltr{direction:ltr;unicode-bidi:isolate}
  .cols{display:flex;gap:20px;align-items:stretch}
  .col{flex:1;display:flex;flex-direction:column;gap:14px;border:2px solid var(--line);
       border-radius:22px;background:#fff;padding:24px 22px;min-width:0}
  .col.last{border-color:var(--purple);background:#f7f4fd}
  .n{width:46px;height:46px;border-radius:14px;background:var(--purple);color:#fff;
     font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .col h3{margin:0;font-size:30px}
  .col p{margin:0;font-size:25px;color:var(--muted);line-height:1.45}
</style><body><div class="sheet" id="shot">
  <div class="cols">
    <div class="col"><span class="n">1</span><h3>איך הוא חושב</h3>
      <p>משפחת המודלים, ואיך בוחרים את הנכון למשימה — כולל רמת המאמץ.</p></div>
    <div class="col"><span class="n">2</span><h3>סביבת עבודה</h3>
      <p>פרויקטים, קונקטורים וסקילים — שלא נתחיל מאפס בכל שיחה.</p></div>
    <div class="col"><span class="n">3</span><h3>שיעבוד לבד</h3>
      <p>משימות מתוזמנות, דפדפן ועבודה על תיקיות במחשב.</p></div>
    <div class="col last"><span class="n">4</span><h3>תוצר אמיתי</h3>
      <p>יוצאים עם פתרון שעובד למשימה שהבאתם איתכם.</p></div>
  </div>
</div></body></html>
