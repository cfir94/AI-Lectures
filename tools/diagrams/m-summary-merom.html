<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><style>
  :root{ --purple:#7a59bc; --blue:#4378ab; --ink:#161922; --muted:#5b6475;
         --line:#d7dce6; --card:#ffffff; }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:transparent}
  .sheet{width:1640px;padding:40px 48px}
  .box{border:2px solid var(--line);border-radius:26px;background:var(--card);padding:24px 26px}
  h3{margin:0;font-size:36px;font-weight:600;color:var(--ink)}
  h3 small{display:block;font-size:24px;font-weight:400;color:var(--muted);margin-top:6px}
  .ltr{direction:ltr;unicode-bidi:isolate}
  .rows{display:flex;flex-direction:column;gap:16px}
  .row{display:grid;grid-template-columns:270px 1fr;gap:24px;align-items:center;
       border:2px solid var(--line);border-radius:20px;background:#fff;padding:19px 24px}
  .k{font-size:28px;font-weight:700;color:var(--purple)}
  .row p{margin:0;font-size:26px;color:var(--ink);line-height:1.45}
  .task{margin-top:26px;border:2px solid var(--purple);border-radius:20px;background:#f7f4fd;
        padding:22px 26px;font-size:29px;text-align:center;color:var(--ink)}
  .task b{color:var(--purple)}
</style><body><div class="sheet" id="shot">
  <div class="rows">
    <div class="row"><span class="k">מודל ומאמץ</span><p>לפי המשימה — לא לפי מי הכי חזק.</p></div>
    <div class="row"><span class="k">פרויקט</span><p>לכל תחום, וקונקטורים לעבודה האמיתית.</p></div>
    <div class="row"><span class="k">סקיל</span><p>לכל מה שחוזר — ותזמון לכל מה שקבוע.</p></div>
  </div>
  <div class="task">המשימה לשבוע: <b>להפעיל את מה שבניתם שלוש פעמים</b> — או לתזמן אותו.</div>
</div></body></html>
