<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><style>
  :root{ --purple:#7a59bc; --blue:#4378ab; --ink:#161922; --muted:#5b6475;
         --line:#d7dce6; --card:#ffffff; }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:transparent}
  .sheet{width:1640px;padding:40px 48px}
  .box{border:2px solid var(--line);border-radius:26px;background:var(--card);padding:24px 26px}
  h3{margin:0;font-size:36px;font-weight:600;color:var(--ink)}
  h3 small{display:block;font-size:24px;font-weight:400;color:var(--muted);margin-top:6px}
  .ltr{direction:ltr;unicode-bidi:isolate}
  .sheet{display:flex;align-items:center;gap:48px}
  .wheel{width:520px;height:520px;border-radius:50%;flex:none;position:relative;
    background:conic-gradient(var(--blue) 0 13.9%,#5a66b7 13.9% 41.7%,
      var(--line) 41.7% 50%,var(--purple) 50% 77.8%,#9b7fd0 77.8% 100%)}
  .hole{position:absolute;inset:26%;border-radius:50%;background:#fafbfd;
    display:flex;flex-direction:column;align-items:center;justify-content:center}
  .hole b{font-size:72px;color:var(--ink);font-weight:600;line-height:1}
  .hole span{font-size:28px;color:var(--muted);margin-top:8px}
  .legend{flex:1;display:flex;flex-direction:column;gap:20px}
  .row{display:flex;align-items:center;gap:18px}
  .sw{width:26px;height:26px;border-radius:8px;flex:none}
  .row b{font-size:34px;color:var(--ink);font-weight:600;min-width:140px}
  .row span{font-size:29px;color:var(--muted)}
</style><body><div class="sheet" id="shot">
    <div class="wheel"><div class="hole"><b>3</b><span>שעות</span></div></div>
<div class="legend">
    <div class="row"><span class="sw" style="background:var(--blue)"></span><b>25 דקות</b><span>מודלים ומכסת שימוש</span></div>
    <div class="row"><span class="sw" style="background:#5a66b7"></span><b>50 דקות</b><span>פרויקטים ומיומנויות על התוכנית</span></div>
    <div class="row"><span class="sw" style="background:var(--line)"></span><b>15 דקות</b><span>הפסקה</span></div>
    <div class="row"><span class="sw" style="background:var(--purple)"></span><b>50 דקות</b><span>אקסל, נוסחאות ותקציב</span></div>
    <div class="row"><span class="sw" style="background:#9b7fd0"></span><b>40 דקות</b><span>משימה משולבת וסיום</span></div>
  </div>
</div></body></html>
