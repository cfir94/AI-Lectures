<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><style>
  :root{ --purple:#7a59bc; --blue:#4378ab; --ink:#161922; --muted:#5b6475;
         --line:#d7dce6; --card:#ffffff; }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:transparent}
  .sheet{width:1640px;padding:40px 48px}
  .box{border:2px solid var(--line);border-radius:26px;background:var(--card);padding:24px 26px}
  h3{margin:0;font-size:36px;font-weight:600;color:var(--ink)}
  h3 small{display:block;font-size:24px;font-weight:400;color:var(--muted);margin-top:6px}
  .ltr{direction:ltr;unicode-bidi:isolate}
  .cols{display:flex;gap:22px;align-items:stretch}
  .col{flex:1;display:flex;flex-direction:column;gap:13px;text-align:center;
       border:2px solid var(--line);border-radius:22px;background:#fff;padding:22px 18px;min-width:0}
  .logo{height:62px;display:flex;align-items:center;justify-content:center}
  .logo img{max-height:58px;max-width:100%}
  .name{font-size:29px;font-weight:600;color:var(--ink)}
  .col p{margin:0;font-size:25px;color:var(--ink);line-height:1.4}
  .eg{font-size:23px;color:var(--muted)}
  .guard{margin-top:26px;border:2px solid var(--purple);border-radius:20px;background:#f7f4fd;
         padding:19px 26px;font-size:28px;text-align:center;color:var(--ink)}
  .guard b{color:var(--purple)}
</style><body><div class="sheet" id="shot">
  <div class="cols">
    <div class="col">
      <div class="logo"><img src="{{mark:outlook-logo-colored-svg}}" alt=""></div>
      <p>מייל ויומן</p>
      <p class="eg">מה מחכה לתגובה, ומה יש בישיבה של מחר.</p>
    </div>
    <div class="col">
      <div class="logo"><span class="name">Google Drive</span></div>
      <p>מסמכים וגיליונות</p>
      <p class="eg">הקבצים שכבר קיימים — בלי להעלות אותם שוב.</p>
    </div>
    <div class="col">
      <div class="logo"><span class="name">Google Workspace</span></div>
      <p>יצירה ועריכה בתוך הכלים</p>
      <p class="eg">Docs, Sheets ו־Slides — דרך התוסף והקונקטורים.</p>
    </div>
  </div>
  <div class="guard">הוא ניגש <b>רק למה שאישרתם</b> — ואפשר לנתק בכל רגע.</div>
</div></body></html>
